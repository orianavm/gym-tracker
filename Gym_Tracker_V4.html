<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gym Tracker V4</title><style>body{font-family:Arial;background:#121212;color:#fff;margin:0;padding:12px} .nav{display:flex;gap:8px;margin-bottom:12px}.btn{background:#3b82f6;color:#fff;border:none;padding:10px 14px;border-radius:10px}.card{background:#1e1e1e;padding:14px;border-radius:14px;margin:10px 0} input,select{width:100%;padding:10px;border-radius:10px;margin:4px 0} h2,h3{margin:6px 0}.goal{color:#7dd3fc}.ready{color:#4ade80}</style></head><body><h1>💪 Gym Tracker V4</h1><div class='card'><select id='profile'><option>Oriana</option><option>Chiara</option></select><select id='day'></select></div><div id='view'></div><script>
const workouts={"Day 1 - Shoulders + Back + Biceps":[["Lat pulldown","compound"],["Chest-supported row","compound"],["Dumbbell shoulder press","compound"],["Cable lateral raise","isolation"],["Rear-delt fly","isolation"],["Incline dumbbell curl","isolation"],["Hammer curl","isolation"]],"Day 2 - Quads + Glutes":[["Hack squat / Smith squat","compound"],["Romanian deadlift","compound"],["Reverse lunge","compound"],["Leg extension","isolation"],["Leg curl","isolation"],["Calf raise","isolation"]],"Day 3 - Shoulders + Chest + Triceps":[["Incline dumbbell press","compound"],["Shoulder press","compound"],["Cable / pec-deck fly","isolation"],["Lateral raise","isolation"],["Rear-delt fly","isolation"],["Triceps pushdown","isolation"],["Overhead triceps extension","isolation"]],"Day 4 - Back + Shoulders + Biceps":[["Assisted pull-up / lat pulldown","compound"],["Seated cable row","compound"],["Single-arm cable row","compound"],["Cable lateral raise","isolation"],["Face pull / rear-delt fly","isolation"],["EZ-bar or cable curl","isolation"],["Preacher curl","isolation"]],"Day 5 - Glutes + Legs + Abs":[["Hip thrust","compound"],["Leg press","compound"],["Bulgarian split squat","compound"],["Seated leg curl","isolation"],["Hip abduction","isolation"],["Cable crunch","isolation"],["Hanging knee raise","isolation"]]};
Object.keys(workouts).forEach(x=>day.add(new Option(x,x)));
function getD(){return JSON.parse(localStorage.getItem('gymV4')||'{}')} function saveD(d){localStorage.setItem('gymV4',JSON.stringify(d))}
function goal(last,type){let max=type==='compound'?12:14;let min=type==='compound'?8:6;if(!last)return [min,min,min,'Start here'];if(last.s1>=max&&last.s2>=max&&last.s3>=max)return [max,max,max,'Increase weight next session'];let cur=Math.max(last.s1,last.s2,last.s3);let tgt=Math.min(max,cur+1);if(last.s1===tgt-1&&last.s2===tgt-1&&last.s3===tgt-1)return [tgt,tgt,tgt,'Target'];return [cur,cur,cur,'Keep working toward'];}
function render(){let p=profile.value,w=day.value,d=getD(),out='';(workouts[w]||[]).forEach((e,i)=>{let h=((d[p]||{})[e[0]]||[]);let last=h[h.length-1];let g=goal(last,e[1]);out+=`<div class='card'><h3>${e[0]}</h3><b>Last Workout</b><div>${last?last.weight+'kg | '+last.s1+'/'+last.s2+'/'+last.s3:'None'}</div><div class='goal'><b>Today's Goal:</b> ${g[0]}/${g[1]}/${g[2]} ${g[3]}</div><input id='w${i}' placeholder='Weight'><input id='s1${i}' placeholder='Set 1'><input id='s2${i}' placeholder='Set 2'><input id='s3${i}' placeholder='Set 3'><button class='btn' onclick="saveEx(${i},'${e[0]}')">Save</button><button class='btn' onclick="hist('${e[0]}')">History</button></div>`});view.innerHTML=out}
function saveEx(i,n){let p=profile.value,d=getD();d[p]=d[p]||{};d[p][n]=d[p][n]||[];d[p][n].push({date:new Date().toLocaleDateString(),weight:document.getElementById('w'+i).value,s1:+document.getElementById('s1'+i).value,s2:+document.getElementById('s2'+i).value,s3:+document.getElementById('s3'+i).value});saveD(d);render();}
function hist(n){let p=profile.value,d=getD();let h=((d[p]||{})[n]||[]);let t=h.map((x,j)=>`${j+1}. ${x.date} - ${x.weight}kg - ${x.s1}/${x.s2}/${x.s3}`).join('
');alert(t||'No history');}
profile.onchange=render;day.onchange=render;render();
</script></body></html>

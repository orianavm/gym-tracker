<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Tracker">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Gym Tracker V4</title>
  <style>
    :root{--bg:#07101f;--panel:#111c2f;--panel2:#17243a;--text:#f7f9fc;--muted:#9eabc1;--blue:#4f8cff;--green:#36d399;--amber:#f7ba45;--red:#ff6b6b;--line:#263650;--shadow:0 10px 30px rgba(0,0,0,.25)}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#07101f,#0d1627 45%,#07101f);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}
    button,input,select,textarea{font:inherit} button{cursor:pointer}
    .app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 14px calc(92px + env(safe-area-inset-bottom))}
    header{padding:18px 4px 8px}.eyebrow{font-size:12px;color:var(--green);font-weight:800;letter-spacing:.12em;text-transform:uppercase}.title{font-size:30px;margin:4px 0 2px}.subtitle{color:var(--muted);font-size:14px}
    .top-controls{display:grid;grid-template-columns:1fr 1.8fr;gap:10px;margin:14px 0}.control,.field{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}.control:focus,.field:focus{border-color:var(--blue)}
    .card{background:rgba(17,28,47,.96);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
    .card h2,.card h3{margin:0 0 10px}.section-title{font-size:20px;margin:20px 2px 8px}.muted{color:var(--muted)}.small{font-size:12px}.strong{font-weight:800}.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--panel2);border-radius:14px;padding:13px}.stat-label{font-size:12px;color:var(--muted);margin-bottom:3px}.stat-value{font-size:20px;font-weight:800}
    .btn{border:0;border-radius:12px;padding:12px 14px;background:var(--blue);color:white;font-weight:800}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}.btn.success{background:#178f68}.btn.danger{background:#9e3440}.btn.smallbtn{padding:8px 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .exercise-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:#223452;color:#bcd0f8;white-space:nowrap}.last-goal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.goalbox{background:var(--panel2);padding:12px;border-radius:14px}.goalbig{font-weight:900;font-size:20px;margin-top:4px}
    label{display:block;color:var(--muted);font-size:12px;margin:8px 0 4px}.set-label{text-align:center;color:var(--muted);font-size:11px}.complete-strip{padding:10px 12px;border-radius:12px;background:rgba(54,211,153,.1);color:var(--green);margin-top:10px}
    .ready-item,.history-row,.custom-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.ready-item:last-child,.history-row:last-child,.custom-row:last-child{border-bottom:0}
    .empty{text-align:center;color:var(--muted);padding:22px 10px}.view{display:none}.view.active{display:block}
    .bottom-nav{position:fixed;z-index:20;left:0;right:0;bottom:0;background:rgba(9,17,30,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:flex;justify-content:center;gap:4px}.navbtn{flex:1;max-width:180px;border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:12px;font-size:12px}.navbtn.active{background:var(--panel2);color:white}.navicon{display:block;font-size:20px;margin-bottom:2px}
    .modal{position:fixed;z-index:40;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:100%;max-width:760px;max-height:90vh;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line)}
    table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line)}th{color:var(--muted)}
    canvas{width:100%;height:220px;background:var(--panel2);border-radius:14px;margin-top:10px}
    .toast{position:fixed;z-index:60;left:50%;bottom:105px;transform:translateX(-50%);background:#eaf2ff;color:#07101f;font-weight:800;padding:11px 16px;border-radius:999px;display:none;box-shadow:var(--shadow)}
    @media(max-width:430px){.top-controls{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.title{font-size:27px}.last-goal{grid-template-columns:1fr 1fr}.card{padding:14px}.app{padding-left:10px;padding-right:10px}}
  </style>
</head>
<body>
<div class="app">
  <header><div class="eyebrow">Personal progression tracker</div><h1 class="title">Gym Tracker</h1><div class="subtitle">Last time, today's target, and what comes next.</div></header>
  <div class="top-controls">
    <select id="profileSelect" class="control" aria-label="Profile"><option>Oriana</option><option>Chiara</option></select>
    <select id="daySelect" class="control" aria-label="Workout day"></select>
  </div>

  <main>
    <section id="workoutView" class="view active"></section>
    <section id="progressView" class="view"></section>
    <section id="settingsView" class="view"></section>
  </main>
</div>
  
<nav class="bottom-nav">

  <button class="navbtn active" data-view="workout">
    <span class="navicon">🏋</span>
    Workout
  </button>

  <button class="navbtn" data-view="progress">
    <span class="navicon">📈</span>
    Progress
  </button>

  <button class="navbtn" data-view="settings">
    <span class="navicon">⚙</span>
    Settings
  </button>

</nav>

<div id="historyModal" class="modal"><div class="sheet"><div id="historyContent"></div><button class="btn secondary" onclick="closeModal('historyModal')">Close</button></div></div>
<div id="editModal" class="modal"><div class="sheet"><div id="editContent"></div></div></div>
<div id="addModal" class="modal"><div class="sheet"><div id="addContent"></div></div></div>
<div id="exerciseModal" class="modal">
    <div class="sheet">
        <div id="exerciseContent"></div>
    </div>
</div>
<div id="toast" class="toast"></div>

<script>
'use strict';
const BASE_WORKOUTS = {
  'Day 1 – Shoulders + Back + Biceps': [
    {name:'Lat pulldown',type:'compound'},{name:'Chest-supported row',type:'compound'},{name:'Dumbbell shoulder press',type:'compound'},
    {name:'Cable lateral raise',type:'isolation'},{name:'Rear-delt fly',type:'isolation'},{name:'Incline dumbbell curl',type:'isolation'},{name:'Hammer curl',type:'isolation'}],
  'Day 2 – Quads + Glutes': [
    {name:'Hack squat / Smith squat',type:'compound'},{name:'Romanian deadlift',type:'compound'},{name:'Reverse lunge',type:'compound'},
    {name:'Leg extension',type:'isolation'},{name:'Leg curl',type:'isolation'},{name:'Calf raise',type:'isolation'}],
  'Day 3 – Shoulders + Chest + Triceps': [
    {name:'Incline dumbbell press',type:'compound'},{name:'Shoulder press',type:'compound'},{name:'Cable / pec-deck fly',type:'isolation'},
    {name:'Lateral raise',type:'isolation'},{name:'Rear-delt fly',type:'isolation'},{name:'Triceps pushdown',type:'isolation'},{name:'Overhead triceps extension',type:'isolation'}],
  'Day 4 – Back + Shoulders + Biceps': [
    {name:'Assisted pull-up / lat pulldown',type:'compound'},{name:'Seated cable row',type:'compound'},{name:'Single-arm cable row',type:'compound'},
    {name:'Cable lateral raise',type:'isolation'},{name:'Face pull / rear-delt fly',type:'isolation'},{name:'EZ-bar or cable curl',type:'isolation'},{name:'Preacher curl',type:'isolation'}],
  'Day 5 – Glutes + Legs + Abs': [
    {name:'Hip thrust',type:'compound'},{name:'Leg press',type:'compound'},{name:'Bulgarian split squat',type:'compound'},
    {name:'Seated leg curl',type:'isolation'},{name:'Hip abduction',type:'isolation'},{name:'Cable crunch',type:'isolation'},{name:'Hanging knee raise',type:'isolation'}]
};
const DAYS = Object.keys(BASE_WORKOUTS);
const STORE_KEY='gymTrackerFinishedV4';
const $=id=>document.getElementById(id);
const esc = s =>
    String(s ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

function freshState(){
    return {
        version: 4,
        profiles: {
            Oriana: {
                custom:{},
                history:{}
            },
            Chiara: {
                custom:{},
                history:{}
            }
        }
    };
}
function loadState(){try{const parsed=JSON.parse(localStorage.getItem(STORE_KEY)||'null');return parsed&&parsed.profiles?parsed:freshState()}catch(e){return freshState()}}
let state=loadState();
function persist(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}
function profileName(){return $('profileSelect').value}
function profileData(){

    const p = profileName();

    state.profiles[p] =
        state.profiles[p] ||
        {
            custom:{},
            history:{}
        };

    return state.profiles[p];

}
function exercisesFor(dayName){const p=profileData();return [...BASE_WORKOUTS[dayName],...((p.custom&&p.custom[dayName])||[])]}
function historyFor(name){return profileData().history[name]||[]}
function lastEntry(name){const h=historyFor(name);return h[h.length-1]||null}
function rangeFor(type){return type==='compound'?{min:8,max:12}:{min:6,max:14}}
function exerciseType(name){for(const day of DAYS){const found=exercisesFor(day).find(e=>e.name===name);if(found)return found.type}return 'compound'}

function goalFor(name,type){
  const h=historyFor(name), range=rangeFor(type), last=h[h.length-1];
  if(!last)return {rep:range.min,text:`${range.min}/${range.min}/${range.min}`,increase:false,weight:''};
  const currentTarget=Number(last.targetRep)||Math.max(range.min,Math.min(range.max,Math.min(last.s1,last.s2,last.s3)));
  const achieved=last.s1>=currentTarget&&last.s2>=currentTarget&&last.s3>=currentTarget;
  if(currentTarget>=range.max&&achieved)
    return {
    rep: range.max,
    text: '✅ Goal achieved. Choose a new weight.',
    increase: true,
    weight: last.weight
};
  const next=achieved?Math.min(range.max,currentTarget+1):currentTarget;
  return {rep:next,text:`${next}/${next}/${next}`,increase:false,weight:last.weight};
}
function isReady(name,type){return goalFor(name,type).increase}
function allKnownExercises(){const map=new Map();DAYS.forEach(day=>exercisesFor(day).forEach(e=>map.set(e.name,e)));return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name))}
function currentDay(){return $('daySelect').value}

function initialiseSelectors(){

    $('daySelect').innerHTML =
        DAYS.map(
            d => `<option>${esc(d)}</option>`
        ).join('');

    $('daySelect').value =
        DAYS[0];

}
function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $(name+'View').classList.add('active');
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===name));
  if(name==='progress')renderProgress();
}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',1800)}
function closeModal(id){$(id).classList.remove('open')}

function renderAll(){

    renderWorkout();

    renderSettings();

    if($('progressView').classList.contains('active')){
        renderProgress();
    }

}

function renderWorkout(){

    const day = currentDay();

    const exercises = exercisesFor(day);

    const completed = exercises.filter(e =>
        historyFor(e.name).some(x =>
            new Date(x.timestamp).toDateString() === new Date().toDateString()
        )
    ).length;

    $('workoutView').innerHTML = `

        <div class="card">

            <div class="exercise-head">

                <div>

                    <div class="eyebrow">
                        Workout
                    </div>

                    <h2>${esc(day)}</h2>

                </div>

                <span class="badge">
                    ${completed} / ${exercises.length} completed
                </span>

            </div>

        </div>

        ${exercises.map(e => exerciseSummaryCard(e)).join('')}

    `;
}

function exerciseSummaryCard(e,i){

    const last = lastEntry(e.name);

    const safe = encodeURIComponent(e.name);

    const today = new Date().toDateString();

    const done =
        historyFor(e.name)
            .some(x =>
                new Date(x.timestamp)
                .toDateString() === today
            );

    return `
        ...
    `;
}

function openExercise(encodedName){

    const name =
        decodeURIComponent(encodedName);

    const ex =
        allKnownExercises()
            .find(x => x.name === name);

    const last =
        lastEntry(name);

    const goal =
        goalFor(name,ex.type);

    $('exerciseContent').innerHTML = `

        <h2>${esc(name)}</h2>

        <p>

            Last:

            ${
                last
                ?
                `${last.weight}kg • ${last.s1}/${last.s2}/${last.s3}`
                :
                'No record'
            }

        </p>

        <p>

            Goal:

            ${goal.text}

        </p>

        <label>Weight</label>

        <input
            id="modalWeight"
            class="field"
            type="number"
            value="${last?last.weight:''}">

        <div class="grid3">

            <input
                id="modalS1"
                class="field"
                type="number"
                placeholder="Set 1">

            <input
                id="modalS2"
                class="field"
                type="number"
                placeholder="Set 2">

            <input
                id="modalS3"
                class="field"
                type="number"
                placeholder="Set 3">

        </div>

        <div class="btn-row">

            <button
                class="btn"
                onclick="saveFromModal('${encodedName}')">

                Save

            </button>

            <button
                class="btn secondary"
                onclick="closeModal('exerciseModal')">

                Cancel

            </button>

        </div>

    `;

    $('exerciseModal')
        .classList
        .add('open');
}

function saveFromModal(encodedName){

    const name =
        decodeURIComponent(encodedName);

    const ex =
        allKnownExercises()
            .find(x => x.name === name);

    const goal =
        goalFor(name,ex.type);

    const weight =
        Number($('modalWeight').value);

    const s1 =
        Number($('modalS1').value);

    const s2 =
        Number($('modalS2').value);

    const s3 =
        Number($('modalS3').value);

    if(
        !(weight > 0)
        ||
        ![s1,s2,s3].every(x=>x>0)
    ){
        toast('Complete all fields');
        return;
    }

    const p = profileData();

    p.history[name] =
        p.history[name] || [];

    p.history[name].push({

        id: uid(),

        timestamp: Date.now(),

        date: new Date()
            .toLocaleDateString(),

        weight,
        s1,
        s2,
        s3,

        targetRep: goal.rep,

        type: ex.type

    });

    persist();

    closeModal('exerciseModal');

    renderWorkout();

    toast('Saved');

}
  

function renderProgress(){
  const exs=allKnownExercises(), selected=$('progressExercise')?.value||exs[0]?.name||'';
  $('progressView').innerHTML=`<div class="card"><h2>Progress</h2><select id="progressExercise" class="control" onchange="renderProgressDetail()">${exs.map(e=>`<option ${e.name===selected?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div><div id="progressDetail"></div>`;
  renderProgressDetail();
}
function renderProgressDetail(){
  const name=$('progressExercise')?.value;if(!name)return;const h=historyFor(name),type=exerciseType(name),range=rangeFor(type);
  $('progressDetail').innerHTML=`<div class="card"><div class="exercise-head"><h3>${esc(name)}</h3><span class="badge">3 × ${range.min}–${range.max}</span></div><canvas id="progressCanvas" width="700" height="220"></canvas></div><div class="card"><h3>History</h3>${h.length?`<div style="overflow:auto"><table><thead><tr><th>Date</th><th>Weight</th><th>Sets</th><th></th></tr></thead><tbody>${h.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.weight)} kg</td><td>${x.s1}/${x.s2}/${x.s3}</td><td><button class="btn secondary smallbtn" onclick="openEdit('${encodeURIComponent(name)}','${x.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No history yet.</div>'}</div>`;
  requestAnimationFrame(()=>drawChart(h));
}
function drawChart(h){
  const c=$('progressCanvas');if(!c)return;const ctx=c.getContext('2d'),W=c.width,H=c.height,pad=34;ctx.clearRect(0,0,W,H);ctx.strokeStyle='#34445f';ctx.lineWidth=1;for(let i=0;i<5;i++){const y=pad+i*(H-2*pad)/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke()}
  if(!h.length){ctx.fillStyle='#9eabc1';ctx.font='16px Arial';ctx.fillText('Log workouts to see the graph.',pad,H/2);return}
  const vals=h.map(x=>Number(x.weight)||0),min=Math.min(...vals),max=Math.max(...vals),span=Math.max(1,max-min);ctx.strokeStyle='#4f8cff';ctx.fillStyle='#4f8cff';ctx.lineWidth=4;ctx.beginPath();vals.forEach((v,i)=>{const x=pad+(vals.length===1?0.5:(i/(vals.length-1)))*(W-2*pad),y=H-pad-((v-min)/span)*(H-2*pad);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();vals.forEach((v,i)=>{const x=pad+(vals.length===1?0.5:(i/(vals.length-1)))*(W-2*pad),y=H-pad-((v-min)/span)*(H-2*pad);ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill()});ctx.fillStyle='#dce7fb';ctx.font='13px Arial';ctx.fillText(`${min} kg`,4,H-pad+4);ctx.fillText(`${max} kg`,4,pad+4)
}
function openHistory(encodedName){showView('progress');renderProgress();$('progressExercise').value=decodeURIComponent(encodedName);renderProgressDetail()}
function openEdit(encodedName,id){
  const name=decodeURIComponent(encodedName),x=historyFor(name).find(v=>v.id===id);if(!x)return;
  $('editContent').innerHTML=`<h2>Edit entry</h2><p class="muted">${esc(name)} · ${esc(x.date)}</p><label>Weight</label><input id="editWeight" class="field" type="number" step="0.1" value="${esc(x.weight)}"><div class="grid3"><input id="editS1" class="field" type="number" value="${x.s1}"><input id="editS2" class="field" type="number" value="${x.s2}"><input id="editS3" class="field" type="number" value="${x.s3}"></div><label>Notes</label><textarea id="editNotes" class="field">${esc(x.notes||'')}</textarea><div class="btn-row"><button class="btn" onclick="commitEdit('${encodeURIComponent(name)}','${id}')">Save changes</button><button class="btn danger" onclick="deleteEntry('${encodeURIComponent(name)}','${id}')">Delete</button><button class="btn secondary" onclick="closeModal('editModal')">Cancel</button></div>`;
  $('editModal').classList.add('open');
}
function commitEdit(encodedName,id){const name=decodeURIComponent(encodedName),x=historyFor(name).find(v=>v.id===id);if(!x)return;x.weight=Number($('editWeight').value);x.s1=Number($('editS1').value);x.s2=Number($('editS2').value);x.s3=Number($('editS3').value);x.notes=$('editNotes').value.trim();if(!(x.weight>0)||![x.s1,x.s2,x.s3].every(v=>v>0)){toast('Enter valid values');return}persist();closeModal('editModal');renderAll();renderProgress();toast('Entry updated')}
function deleteEntry(encodedName,id){const name=decodeURIComponent(encodedName),h=historyFor(name),idx=h.findIndex(v=>v.id===id);if(idx<0)return;if(!confirm('Delete this workout entry?'))return;h.splice(idx,1);persist();closeModal('editModal');renderAll();renderProgress();toast('Entry deleted')}

function renderSettings(){
  const custom=Object.entries(profileData().custom||{}).flatMap(([day,items])=>items.map((e,index)=>({day,e,index})));
  $('settingsView').innerHTML=`<div class="card"><h2>Exercises</h2><p class="muted">Custom exercises belong only to ${esc(profileName())}.</p><button class="btn" onclick="openAddExercise()">Add custom exercise</button>${custom.length?custom.map(x=>`<div class="custom-row"><div><b>${esc(x.e.name)}</b><div class="small muted">${esc(x.day)} · ${x.e.type}</div></div><button class="btn danger smallbtn" onclick="removeCustom('${encodeURIComponent(x.day)}',${x.index})">Remove</button></div>`).join(''):'<div class="empty">No custom exercises.</div>'}</div>
  <div class="card"><h2>Backup & restore</h2><p class="muted">Data is stored separately in this browser. Export regularly, especially before clearing Safari data or changing phones.</p><div class="btn-row"><button class="btn" onclick="exportBackup()">Export backup</button><label class="btn secondary" style="display:inline-block;color:white">Import backup<input type="file" accept="application/json" style="display:none" onchange="importBackup(event)"></label></div></div>
  <div class="card"><h2>About progression</h2><p class="muted">Compounds use 3 × 8–12. Isolations use 3 × 6–14. A target remains in place until all three sets reach it. At the top of the range, the app asks you to choose a new weight.</p></div>`;
}
function openAddExercise(){$('addContent').innerHTML=`<h2>Add exercise for ${esc(profileName())}</h2><label>Name</label><input id="addName" class="field" placeholder="Exercise name"><label>Day</label><select id="addDay" class="control">${DAYS.map(d=>`<option>${esc(d)}</option>`).join('')}</select><label>Type</label><select id="addType" class="control"><option value="compound">Compound · 8–12</option><option value="isolation">Isolation · 6–14</option></select><div class="btn-row"><button class="btn" onclick="commitAddExercise()">Add exercise</button><button class="btn secondary" onclick="closeModal('addModal')">Cancel</button></div>`;$('addModal').classList.add('open')}
function commitAddExercise(){const name=$('addName').value.trim(),day=$('addDay').value,type=$('addType').value;if(!name){toast('Enter an exercise name');return}if(allKnownExercises().some(e=>e.name.toLowerCase()===name.toLowerCase())){toast('That exercise already exists');return}const p=profileData();p.custom[day]=p.custom[day]||[];p.custom[day].push({name,type,custom:true});persist();closeModal('addModal');renderAll();toast('Exercise added')}
function removeCustom(dayEncoded,index){const day=decodeURIComponent(dayEncoded);if(!confirm('Remove this custom exercise from the workout? Its saved history will remain.'))return;profileData().custom[day].splice(index,1);persist();renderAll();toast('Custom exercise removed')}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`gym-tracker-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importBackup(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const incoming=JSON.parse(reader.result);if(!incoming.profiles)throw new Error();state=incoming;persist();initialiseSelectors();renderAll();toast('Backup imported')}catch(e){alert('This is not a valid Gym Tracker backup.')}};reader.readAsText(file)}

$('profileSelect').addEventListener('change',()=>{

    initialiseSelectors();

    renderAll();

});

$('daySelect').addEventListener('change',renderWorkout);
  
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));
initialiseSelectors();renderAll();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>

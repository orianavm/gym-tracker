<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gym Tracker V4</title><style>body{font-family:Arial,sans-serif;background:#121212;color:#fff;margin:0;padding:15px}.card{background:#1f1f1f;border-radius:12px;padding:12px;margin:10px 0}input,select,button{padding:10px;border-radius:8px;margin:4px;width:100%;box-sizing:border-box}button{background:#3b82f6;color:white;border:none;width:auto}.goal{color:#7dd3fc}.section{color:#4ade80}</style></head><body><h1>💪 Gym Tracker V4</h1><div class='card'><select id='profile'><option>Oriana</option><option>Chiara</option></select><select id='day'></select><button onclick='renderWorkout()'>Refresh Workout</button></div><div id='content'></div><script>const workouts={'Day 1 – Shoulders + Back + Biceps':[['Lat pulldown','compound'],['Chest-supported row','compound'],['Dumbbell shoulder press','compound'],['Cable lateral raise','isolation'],['Rear-delt fly','isolation'],['Incline dumbbell curl','isolation'],['Hammer curl','isolation']],'Day 2 – Quads + Glutes':[['Hack squat / Smith squat','compound'],['Romanian deadlift','compound'],['Reverse lunge','compound'],['Leg extension','isolation'],['Leg curl','isolation'],['Calf raise','isolation']],'Day 3 – Shoulders + Chest + Triceps':[['Incline dumbbell press','compound'],['Shoulder press','compound'],['Cable / pec-deck fly','isolation'],['Lateral raise','isolation'],['Rear-delt fly','isolation'],['Triceps pushdown','isolation'],['Overhead triceps extension','isolation']],'Day 4 – Back + Shoulders + Biceps':[['Assisted pull-up / lat pulldown','compound'],['Seated cable row','compound'],['Single-arm cable row','compound'],['Cable lateral raise','isolation'],['Face pull / rear-delt fly','isolation'],['EZ-bar or cable curl','isolation'],['Preacher curl','isolation']],'Day 5 – Glutes + Legs + Abs':[['Hip thrust','compound'],['Leg press','compound'],['Bulgarian split squat','compound'],['Seated leg curl','isolation'],['Hip abduction','isolation'],['Cable crunch','isolation'],['Hanging knee raise','isolation']]};const day=document.getElementById('day');Object.keys(workouts).forEach(d=>day.add(new Option(d,d)));function getData(){return JSON.parse(localStorage.getItem('gymV4')||'{}')}function saveData(d){localStorage.setItem('gymV4',JSON.stringify(d))}function getGoal(last,type){const max=type==='compound'?12:14;const min=type==='compound'?8:6;if(!last)return{target:min+'/'+min+'/'+min,msg:'Start here'};if(last.s1>=max&&last.s2>=max&&last.s3>=max)return{target:max+'/'+max+'/'+max,msg:'✅ Increase weight next session'};const next=Math.min(max,Math.min(last.s1,last.s2,last.s3)+1);return{target:next+'/'+next+'/'+next,msg:'🎯 Match this target'};}function readyExercises(profile){const d=getData();let ready=[];Object.keys(d[profile]||{}).forEach(ex=>{let h=d[profile][ex];let last=h[h.length-1];if(last&&last.s1>=12&&last.s2>=12&&last.s3>=12)ready.push(ex)});return ready;}function renderWorkout(){const p=profile.value;const w=day.value;const d=getData();let out='';const ready=readyExercises(p);out+=`<div class='card'><h3>🔥 Ready To Increase</h3>${ready.length?ready.join('<br>'):'None yet'}</div>`;(workouts[w]||[]).forEach((e,i)=>{const hist=((d[p]||{})[e[0]]||[]);const last=hist[hist.length-1];const g=getGoal(last,e[1]);out+=`<div class='card'><h2>${e[0]}</h2><b>Last Workout</b><div>${last?last.weight+'kg | '+last.s1+'/'+last.s2+'/'+last.s3:'None recorded'}</div><br><div class='goal'><b>Today's Goal</b><br>${g.target}<br>${g.msg}</div><br><input id='w${i}' placeholder='Weight' value='${last?last.weight:''}'><input id='s1${i}' placeholder='Set 1'><input id='s2${i}' placeholder='Set 2'><input id='s3${i}' placeholder='Set 3'><button onclick="saveExercise(${i},'${e[0]}',event)">Save</button><button onclick="showHistory('${e[0]}')">History</button></div>`});content.innerHTML=out;}function saveExercise(i,n,event){const p=profile.value;const d=getData();d[p]=d[p]||{};d[p][n]=d[p][n]||[];d[p][n].push({date:new Date().toLocaleDateString(),weight:document.getElementById('w'+i).value,s1:Number(document.getElementById('s1'+i).value),s2:Number(document.getElementById('s2'+i).value),s3:Number(document.getElementById('s3'+i).value)});saveData(d);event.target.innerText='✅ Saved';setTimeout(renderWorkout,500);}function showHistory(n){const p=profile.value;const d=getData();const h=((d[p]||{})[n]||[]);alert(h.length?h.map((x,i)=>(i+1)+'. '+x.date+' | '+x.weight+'kg | '+x.s1+'/'+x.s2+'/'+x.s3).join('
'):'No history yet');}profile.onchange=renderWorkout;day.onchange=renderWorkout;renderWorkout();</script></body></html>

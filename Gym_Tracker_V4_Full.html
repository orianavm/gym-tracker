<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gym Tracker V4</title><style>body{font-family:Arial;background:#121212;color:#fff;margin:0}header{padding:15px;background:#1b1b1b;position:sticky;top:0}section{padding:12px}.card{background:#1f1f1f;border-radius:12px;padding:12px;margin:10px 0}.tabs button{margin:2px;padding:10px}.active{background:#2563eb;color:#fff}.hidden{display:none}input,select,textarea,button{padding:10px;border-radius:8px;margin:4px;width:100%;box-sizing:border-box}button{border:none;background:#2563eb;color:#fff}.row{display:flex;gap:8px}.row>*{flex:1}</style></head><body><header><h2>💪 Gym Tracker V4</h2><div class="row"><select id="profile"><option>Oriana</option><option>Chiara</option></select><select id="day"></select></div><div class="tabs"><button onclick="showTab('dashboard')">Dashboard</button><button onclick="showTab('workout')">Workout</button><button onclick="showTab('progress')">Progress</button><button onclick="showTab('settings')">Settings</button></div></header><section id="dashboard"></section><section id="workout"></section><section id="progress" class="hidden"></section><section id="settings" class="hidden"></section><script>const workouts={'Day 1 – Shoulders + Back + Biceps':[['Lat pulldown','compound'],['Chest-supported row','compound'],['Dumbbell shoulder press','compound'],['Cable lateral raise','isolation'],['Rear-delt fly','isolation'],['Incline dumbbell curl','isolation'],['Hammer curl','isolation']],'Day 2 – Quads + Glutes':[['Hack squat / Smith squat','compound'],['Romanian deadlift','compound'],['Reverse lunge','compound'],['Leg extension','isolation'],['Leg curl','isolation'],['Calf raise','isolation']],'Day 3 – Shoulders + Chest + Triceps':[['Incline dumbbell press','compound'],['Shoulder press','compound'],['Cable / pec-deck fly','isolation'],['Lateral raise','isolation'],['Rear-delt fly','isolation'],['Triceps pushdown','isolation'],['Overhead triceps extension','isolation']],'Day 4 – Back + Shoulders + Biceps':[['Assisted pull-up / lat pulldown','compound'],['Seated cable row','compound'],['Single-arm cable row','compound'],['Cable lateral raise','isolation'],['Face pull / rear-delt fly','isolation'],['EZ-bar or cable curl','isolation'],['Preacher curl','isolation']],'Day 5 – Glutes + Legs + Abs':[['Hip thrust','compound'],['Leg press','compound'],['Bulgarian split squat','compound'],['Seated leg curl','isolation'],['Hip abduction','isolation'],['Cable crunch','isolation'],['Hanging knee raise','isolation']]};const queue=['Day 1 – Shoulders + Back + Biceps','Day 2 – Quads + Glutes','Day 3 – Shoulders + Chest + Triceps','Day 4 – Back + Shoulders + Biceps','Day 5 – Glutes + Legs + Abs'];Object.keys(workouts).forEach(d=>day.add(new Option(d,d)));function db(){return JSON.parse(localStorage.getItem('gymV4Full')||'{}')}function save(x){localStorage.setItem('gymV4Full',JSON.stringify(x))}function iso(n){return ['Cable lateral raise','Rear-delt fly','Incline dumbbell curl','Hammer curl','Leg extension','Leg curl','Calf raise','Cable / pec-deck fly','Lateral raise','Triceps pushdown','Overhead triceps extension','Face pull / rear-delt fly','EZ-bar or cable curl','Preacher curl','Seated leg curl','Hip abduction','Cable crunch','Hanging knee raise'].includes(n)}function getTarget(last,name){let min=iso(name)?6:8,max=iso(name)?14:12;if(!last)return `${min}/${min}/${min}`;if(last.s1>=max&&last.s2>=max&&last.s3>=max)return 'Increase Weight';let base=(last.target||`${min}/${min}/${min}`).split('/').map(Number)[0];if(last.s1>=base&&last.s2>=base&&last.s3>=base)base++;base=Math.min(base,max);return `${base}/${base}/${base}`;}function render(){let p=profile.value,d=db();let ready=[];let prs=[];Object.keys(d[p]||{}).forEach(ex=>{let h=d[p][ex];if(!h.length)return;let l=h[h.length-1];let mx=iso(ex)?14:12;if(l.s1>=mx&&l.s2>=mx&&l.s3>=mx)ready.push(ex);prs.push({e:ex,w:Number(l.weight)||0});});prs.sort((a,b)=>b.w-a.w);dashboard.innerHTML=`<div class=card><h3>🔥 Ready To Increase</h3>${ready.length?ready.join('<br>'):'None'}</div><div class=card><h3>🏆 Top PRs</h3>${prs.slice(0,5).map(x=>x.e+' - '+x.w+'kg').join('<br>')}</div>`;let out='';(workouts[day.value]||[]).forEach((e,i)=>{let h=((d[p]||{})[e[0]]||[]);let last=h[h.length-1];let target=getTarget(last,e[0]);out+=`<div class=card><h3>${e[0]}</h3><b>Last:</b> ${last?last.weight+'kg '+last.s1+'/'+last.s2+'/'+last.s3:'None'}<br><b>Goal:</b> ${target}<input id=w${i} value='${last?last.weight:''}' placeholder='Weight'><div class=row><input id=s1${i} placeholder='S1'><input id=s2${i} placeholder='S2'><input id=s3${i} placeholder='S3'></div><textarea id=n${i} placeholder='Notes'></textarea><button onclick="saveEx(${i},'${e[0]}','${target}')">Save</button><button onclick="showHistory('${e[0]}')">History</button></div>`});workout.innerHTML=out;let prog='';Object.keys(d[p]||{}).forEach(ex=>{prog+=`<div class=card><h4>${ex}</h4>${(d[p][ex]||[]).map((x,idx)=>`${idx+1}. ${x.date} | ${x.weight}kg | ${x.s1}/${x.s2}/${x.s3} <button onclick="delEntry('${ex}',${idx})">Delete</button>`).join('<br>')}</div>`});progress.innerHTML=prog||'<div class=card>No history yet</div>';settings.innerHTML=`<div class=card><button onclick='addExercise()'>Add Exercise</button><button onclick='exportData()'>Export Backup</button><input type=file onchange='importData(event)'></div>`}function saveEx(i,n,t){let d=db(),p=profile.value;d[p]=d[p]||{};d[p][n]=d[p][n]||[];d[p][n].push({date:new Date().toLocaleDateString(),weight:w(i),s1:v('s1'+i),s2:v('s2'+i),s3:v('s3'+i),notes:document.getElementById('n'+i).value,target:t});save(d);render()}function w(i){return document.getElementById('w'+i).value}function v(id){return Number(document.getElementById(id).value)||0}function showHistory(n){let d=db(),p=profile.value;alert((d[p][n]||[]).map(x=>x.date+' '+x.weight+'kg '+x.s1+'/'+x.s2+'/'+x.s3).join('
'))}function delEntry(ex,i){let d=db(),p=profile.value;d[p][ex].splice(i,1);save(d);render()}function addExercise(){let n=prompt('Exercise');if(!n)return;let t=prompt('compound or isolation');let dayIdx=prompt('Day number 1-5');workouts[queue[dayIdx-1]].push([n,t]);render()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db())]));a.download='gym_backup.json';a.click()}function importData(e){let r=new FileReader();r.onload=()=>{save(JSON.parse(r.result));render()};r.readAsText(e.target.files[0])}function showTab(id){['dashboard','workout','progress','settings'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}profile.onchange=render;day.onchange=render;day.value=queue[0];render();</script></body></html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gym Tracker V4</title>
<style>
body{font-family:Arial,sans-serif;background:#121212;color:#fff;margin:0;padding:15px}
.card{background:#1f1f1f;border-radius:12px;padding:12px;margin:10px 0}
input,select,button,textarea{padding:10px;border-radius:8px;margin:4px;width:100%;box-sizing:border-box}
button{background:#2563eb;color:#fff;border:none}
.nav{display:flex;gap:8px}.nav button{width:auto}
.goal{color:#7dd3fc}.success{color:#4ade80}
.small{color:#aaa;font-size:.9em}
</style>
</head>
<body>
<h1>💪 Gym Tracker V4</h1>
<div class='card'>
<select id='profile'><option>Oriana</option><option>Chiara</option></select>
<select id='day'></select>
</div>
<div id='dashboard'></div>
<div id='content'></div>
<script>
const workouts={
'Day 1 – Shoulders + Back + Biceps':[['Lat pulldown','compound'],['Chest-supported row','compound'],['Dumbbell shoulder press','compound'],['Cable lateral raise','isolation'],['Rear-delt fly','isolation'],['Incline dumbbell curl','isolation'],['Hammer curl','isolation']],
'Day 2 – Quads + Glutes':[['Hack squat / Smith squat','compound'],['Romanian deadlift','compound'],['Reverse lunge','compound'],['Leg extension','isolation'],['Leg curl','isolation'],['Calf raise','isolation']],
'Day 3 – Shoulders + Chest + Triceps':[['Incline dumbbell press','compound'],['Shoulder press','compound'],['Cable / pec-deck fly','isolation'],['Lateral raise','isolation'],['Rear-delt fly','isolation'],['Triceps pushdown','isolation'],['Overhead triceps extension','isolation']],
'Day 4 – Back + Shoulders + Biceps':[['Assisted pull-up / lat pulldown','compound'],['Seated cable row','compound'],['Single-arm cable row','compound'],['Cable lateral raise','isolation'],['Face pull / rear-delt fly','isolation'],['EZ-bar or cable curl','isolation'],['Preacher curl','isolation']],
'Day 5 – Glutes + Legs + Abs':[['Hip thrust','compound'],['Leg press','compound'],['Bulgarian split squat','compound'],['Seated leg curl','isolation'],['Hip abduction','isolation'],['Cable crunch','isolation'],['Hanging knee raise','isolation']]
};
const day=document.getElementById('day');Object.keys(workouts).forEach(d=>day.add(new Option(d,d)));
function data(){return JSON.parse(localStorage.getItem('gymTrackerV4')||'{}')}
function save(d){localStorage.setItem('gymTrackerV4',JSON.stringify(d))}
function goal(last,type){const min=type==='compound'?8:6;const max=type==='compound'?12:14;if(!last)return{target:`${min}/${min}/${min}`,msg:'Start here'};if(last.s1>=max&&last.s2>=max&&last.s3>=max)return{target:'Increase Weight',msg:'✅ Weight increase unlocked'};const targetRep=Math.min(max,Math.min(last.s1,last.s2,last.s3)+1);return{target:`${targetRep}/${targetRep}/${targetRep}`,msg:'🎯 Match this target on all sets'}}
function readyList(profile){const d=data();let r=[];Object.keys(d[profile]||{}).forEach(ex=>{let h=d[profile][ex];let last=h[h.length-1];if(!last)return;let iso=['Cable lateral raise','Rear-delt fly','Incline dumbbell curl','Hammer curl','Leg extension','Leg curl','Calf raise','Cable / pec-deck fly','Lateral raise','Triceps pushdown','Overhead triceps extension','Face pull / rear-delt fly','EZ-bar or cable curl','Preacher curl','Seated leg curl','Hip abduction','Cable crunch','Hanging knee raise'];let max=iso.includes(ex)?14:12;if(last.s1>=max&&last.s2>=max&&last.s3>=max)r.push(ex);});return r;}
function render(){const p=profile.value,w=day.value,d=data();const ready=readyList(p);dashboard.innerHTML=`<div class='card'><h3>🔥 Ready To Increase</h3>${ready.length?ready.join('<br>'):'None yet'}</div>`;let out='';(workouts[w]||[]).forEach((e,i)=>{let hist=((d[p]||{})[e[0]]||[]);let last=hist[hist.length-1];let g=goal(last,e[1]);out+=`<div class='card'><h3>${e[0]}</h3><div><b>Last Workout</b><br>${last?last.weight+'kg | '+last.s1+'/'+last.s2+'/'+last.s3:'None recorded'}</div><br><div class='goal'><b>Today's Goal</b><br>${last?last.weight+'kg':''}<br>${g.target}<br>${g.msg}</div><input id='w${i}' type='number' step='0.5' value='${last?last.weight:''}' placeholder='Weight'><input id='s1${i}' type='number' placeholder='Set 1'><input id='s2${i}' type='number' placeholder='Set 2'><input id='s3${i}' type='number' placeholder='Set 3'><textarea id='n${i}' placeholder='Notes (optional)'></textarea><button onclick="saveEx(${i},'${e[0]}')">Save</button><button onclick="historyEx('${e[0]}')">History</button></div>`});content.innerHTML=out;}
function saveEx(i,name){let d=data(),p=profile.value;d[p]=d[p]||{};d[p][name]=d[p][name]||[];d[p][name].push({date:new Date().toLocaleDateString(),weight:document.getElementById('w'+i).value,s1:+document.getElementById('s1'+i).value,s2:+document.getElementById('s2'+i).value,s3:+document.getElementById('s3'+i).value,notes:document.getElementById('n'+i).value});save(d);render();}
function historyEx(name){
    let d=data(),
        p=profile.value,
        h=((d[p]||{})[name]||[]);

    let text=name+'\\n\\n';

    h.forEach((x,i)=>
        text += `${i+1}. ${x.date} | ${x.weight}kg | ${x.s1}/${x.s2}/${x.s3}${x.notes ? ' | ' + x.notes : ''}\\n`
    );

    alert(text);
}
profile.onchange=render;day.onchange=render;render();
</script>
</body></html>
